server {
    listen 3000 default_server;
    listen [::]:3000 default_server;

    server_name _;
    client_max_body_size 2048M;
    absolute_redirect off;

    location = /_auth_verify {
        internal;
        proxy_pass http://127.0.0.1:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @login {
        return 302 /login.html;
    }

    location = /login.html {
        root /app/frontend;
    }

    location /css/ {
        root /app/frontend;
    }

    location /js/ {
        root /app/frontend;
    }

    location / {
        auth_request /_auth_verify;
        error_page 401 = @login;
        root /app/frontend;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /stream/ {
        auth_request /_auth_verify;
        error_page 401 = @login;
        alias /usr/share/selkies/web/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location ~ ^/(stream/)?websocket {
        auth_request /_auth_verify;
        rewrite ^/stream(/websocket.*)$ $1 break;
        proxy_pass http://127.0.0.1:CWS;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

