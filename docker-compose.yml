services:
  selkies-rdp:
    # Prebuilt image published by .github/workflows/docker-publish.yml
    image: ghcr.io/rangodj/vnc-hub:latest
    # To build locally instead, replace the image line above with:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: selkies-rdp
    restart: unless-stopped
    shm_size: "2gb" # Crucial for high-resolution 60fps streaming buffers

    ports:
      - "8080:3000" # HTTP:  http://<host-ip>:8080
      - "8443:3001" # HTTPS (self-signed): https://<host-ip>:8443 — needed for browser clipboard access

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC

      # ================= Encoding Configuration =================
      # Options: h264enc (auto NVENC/VAAPI/CPU fallback), x264enc (CPU only), jpeg
      - SELKIES_ENCODER=h264enc

      # ================= Authentication Configuration =================
      # Options: none, basic, oidc, forward_auth
      - AUTH_MODE=${AUTH_MODE:-none}

      # Basic Auth settings (used when AUTH_MODE=basic). Logins are rejected until a password is set.
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}

      # Authentik / OIDC SSO settings (used when AUTH_MODE=oidc)
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-http://localhost:8080/auth/callback}
      - OIDC_SCOPES=openid email profile
      - OIDC_VERIFY_SSL=${OIDC_VERIFY_SSL:-true}

      # Forward Auth / Authentik Outpost settings (used when AUTH_MODE=forward_auth)
      - FORWARD_AUTH_HEADER=${FORWARD_AUTH_HEADER:-X-authentik-username}
      # Required: IPs/CIDRs of your reverse proxy, e.g. 172.18.0.0/16. Other sources cannot set the header.
      - FORWARD_AUTH_TRUSTED_PROXIES=${FORWARD_AUTH_TRUSTED_PROXIES:-}

      # Session cookie Secure flag: auto (follows https), true, false
      - COOKIE_SECURE=${COOKIE_SECURE:-auto}

      # Optional custom session secret key (auto-generated if omitted)
      - SECRET_KEY=${SECRET_KEY:-}

      # --- GPU: AMD or Intel (VA-API) — uncomment together with the devices block below ---
      # - DRINODE=/dev/dri/renderD128
      # - DRI_NODE=/dev/dri/renderD128

      # --- GPU: NVIDIA (NVENC) — uncomment together with the deploy block below ---
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      # Persistent storage for saved connection profiles and session secrets
      - ./config:/config
      # Shared folder mounted as RDP drive in Windows (\\tsclient\SharedFolder)
      - ./shared:/shared

    # ================= GPU ACCELERATION PROFILES =================
    # Keep the matching environment lines above uncommented too.
    # Do not add a second "environment:" key — YAML would silently discard the one above.

    # --- Profile 1: AMD or Intel GPU (VA-API) ---
    # devices:
    #   - /dev/dri:/dev/dri

    # --- Profile 2: NVIDIA GPU (NVENC) with nvidia-container-toolkit ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
